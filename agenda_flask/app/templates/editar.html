<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar actividad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="contenedor">
        <h1>Editar actividad</h1>

        <form action="{{ url_for('editar', id=actividad['id']) }}" method="POST">

            <label>Título</label>
            <input type="text" name="titulo" value="{{ actividad['titulo'] }}" required>

            <label>Descripción</label>
            <input type="text" name="descripcion" value="{{ actividad['descripcion'] or '' }}">

            <label>Fecha</label>
            <input type="date" name="fecha" value="{{ actividad['fecha'] }}" required>

            <label class="checkbox">
                <input type="checkbox" name="completada" {% if actividad['completada'] %}checked{% endif %}>
                Actividad completada
            </label>

            <button type="submit" class="guardar">
                Guardar cambios
            </button>

            <a href="{{ url_for('inicio') }}" class="volver">
                Regresar
            </a>
        </form>
    </div>

</body>

</html>
